services:
  mysql:
    image: mysql:8.2
    container_name: zaki_mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: zakiroot
      MYSQL_DATABASE: zaki_store
      MYSQL_USER: zaki
      MYSQL_PASSWORD: zakipass
    volumes:
      - zaki_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uzaki", "-pzakipass"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: zaki_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  zaki_mysql_data:
